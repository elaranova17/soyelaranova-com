<!DOCTYPE html><html><head><meta charset="utf-8"><title>Isotipos Elara Nova</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Great+Vibes&display=swap" rel="stylesheet">
<style>body{background:#fff;margin:0;padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;font-family:sans-serif}
figure{background:#F6EFE3;border-radius:18px;margin:0;padding:26px;text-align:center}
img{width:120px;height:120px}
.wm{font-family:'Bagel Fat One';font-size:30px;line-height:1;margin-top:14px}
.wm .a{color:#E85D9F}.wm .b{color:#9A66D9}
.by{font-family:'Great Vibes';font-size:17px;color:#4A2D57}
figcaption{font-size:12px;color:#4A2D57;margin-top:10px}</style></head><body>
<figure><img src="isotipo-nova.svg"><div class="wm"><span class="a">elara</span> <span class="b">nova</span></div><div class="by">by Evelyn Patiño</div><figcaption>A · La Nova — la estrella que explota de brillo (doble destello)</figcaption></figure>
<figure><img src="isotipo-corazon-click.svg"><div class="wm"><span class="a">elara</span> <span class="b">nova</span></div><div class="by">by Evelyn Patiño</div><figcaption>B · Click con amor — corazón + cursor ("menos a mano" = un click)</figcaption></figure>
<figure><img src="isotipo-e-nova.svg"><div class="wm"><span class="a">elara</span> <span class="b">nova</span></div><div class="by">by Evelyn Patiño</div><figcaption>C · La "e" nova — monograma bubble con chispas</figcaption></figure>
</body></html>
